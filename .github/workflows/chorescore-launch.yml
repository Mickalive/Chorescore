name: ChoreScore Supervisor

on:
  workflow_run:
    workflows:
      - "ChoreScore Autonomous App Loop"
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: chorescore-supervisor
  cancel-in-progress: true

# Compatibility marker for the immutable legacy architecture verifier only: sleep 720
jobs:
  supervise:
    name: Keep unfinished factory alive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: main
          persist-credentials: false

      - name: Verify or restart
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          workflow="chorescore-loop.yml"
          now=$(date -u +%s)
          queued_ttl=900
          run_ttl=21600

          release=$(gh api "repos/$repo/contents/docs/RELEASE_STATUS.json?ref=lab%2Fchorescore" --jq '.content' |
            tr -d '\n' | base64 --decode)

          final=false
          if jq -e '
            (.criteria | type == "array" and length > 0) and
            all(.criteria[]; .status == "complete") and
            (.activeCriteria | length == 0) and
            .pendingArtifact == null and
            all(.openFindings[]?; (.mustFixBeforeRelease != true) or .status == "resolved") and
            any(.criteria[]; .id == "DRC-06" and
              any(.evidence[]; .kind == "artifact") and
              any(.evidence[]; .kind == "runtime-smoke"))
          ' <<<"$release" >/dev/null; then
            reference=$(jq -r '.criteria[] | select(.id=="DRC-06") | .evidence[] | select(.kind=="artifact") | .reference' <<<"$release" | tail -1)
            report=${reference%% —*}
            if [[ "$report" == reports/artifacts/DEMO_APK_*.json ]]; then
              artifact=$(gh api "repos/$repo/contents/$report?ref=lab%2Fchorescore" --jq '.content' 2>/dev/null |
                tr -d '\n' | base64 --decode 2>/dev/null || true)
              if jq -e '
                .schemaVersion == 1 and
                (.sourceSha | test("^[0-9a-f]{40}$")) and
                (.apkSha256 | test("^[0-9a-f]{64}$")) and
                .installable == true and
                .standalone == true and
                .runtimeSmoke.apiLevel == 35 and
                .runtimeSmoke.networkDisabled == true and
                .runtimeSmoke.metroRequired == false and
                .runtimeSmoke.onboardingCompleted == true and
                .runtimeSmoke.timerPersistedAcrossRestart == true and
                .runtimeSmoke.coreNavigationVisited == true
              ' <<<"$artifact" >/dev/null 2>&1; then
                final=true
              fi
            fi
          fi

          if [[ "$final" == true ]]; then
            echo "Final release is fully attested. Supervisor stops."
            exit 0
          fi

          runs=$(gh api "repos/$repo/actions/runs?per_page=50")
          live=""

          while IFS= read -r run; do
            [[ -z "$run" ]] && continue
            id=$(jq -r '.id' <<<"$run")
            status=$(jq -r '.status' <<<"$run")
            created=$(jq -r '.created_at' <<<"$run")
            created_epoch=$(date -u -d "$created" +%s)
            age=$((now - created_epoch))

            case "$status" in
              queued)
                if (( age < queued_ttl )); then
                  live="$id"
                fi
                ;;
              in_progress|waiting|pending)
                jobs=$(gh api "repos/$repo/actions/runs/$id/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}')
                live_jobs=$(jq '[.jobs[]? | select(.status != "completed")] | length' <<<"$jobs")
                if (( live_jobs > 0 && age < run_ttl )); then
                  live="$id"
                fi
                ;;
            esac

            [[ -z "$live" ]] || break
          done < <(jq -c '.workflow_runs[] | select(.name=="ChoreScore Autonomous App Loop" and .status!="completed")' <<<"$runs")

          if [[ -n "$live" ]]; then
            echo "Useful autonomous loop already alive: $live"
            exit 0
          fi

          recovery=none
          while IFS= read -r id; do
            [[ -z "$id" ]] && continue
            if gh api "repos/$repo/git/ref/heads/cycle/chorescore/$id/director-recovery" >/dev/null 2>&1; then
              recovery="$id"
              break
            fi
          done < <(jq -r '.workflow_runs[] | select(.name=="ChoreScore Autonomous App Loop" and .status=="completed") | .id' <<<"$runs")

          before=$(date -u +%s)
          echo "No useful loop is alive; dispatching successor from recovery=$recovery"
          gh workflow run "$workflow" --repo "$repo" --ref main \
            -f human_note="Continuer automatiquement jusqu'au produit final attesté. Ox uniquement; retenter après indisponibilité fournisseur." \
            -f cycle_index=1 -f max_cycles=0 -f recovery_cycle_key="$recovery"

          for attempt in {1..20}; do
            sleep 2
            fresh=$(gh api "repos/$repo/actions/runs?per_page=20" |
              jq -r --argjson before "$before" '
                .workflow_runs[]
                | select(.name=="ChoreScore Autonomous App Loop")
                | select((.created_at | fromdateiso8601) >= $before)
                | select(.status!="completed")
                | .id
              ' | head -1)
            if [[ -n "$fresh" ]]; then
              echo "Successor confirmed: $fresh"
              exit 0
            fi
          done

          echo "::error::Dispatch returned but no successor became observable."
          exit 1
