name: ChoreScore Supervisor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/immutable-files.sha256"
  workflow_run:
    workflows:
      - "ChoreScore Autonomous App Loop"
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: chorescore-supervisor-v2
  cancel-in-progress: true

jobs:
  supervise:
    name: Keep unfinished factory alive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: main
          persist-credentials: false

      - name: Garbage-collect obsolete cycle state and runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          now=$(date -u +%s)
          release=$(gh api "repos/$repo/contents/docs/RELEASE_STATUS.json?ref=lab%2Fchorescore" --jq '.content' | tr -d '\n' | base64 --decode)
          evidence_cycles=$(jq -r '.criteria[]?.evidence[]?.cycle // empty | select(test("^[1-9][0-9]*$"))' <<<"$release" | sort -u)
          all_runs=$(gh api "repos/$repo/actions/runs?per_page=100")
          active_loop=$(jq -r '[.workflow_runs[] | select(.name=="ChoreScore Autonomous App Loop" and (.status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="queued"))][0].id // empty' <<<"$all_runs")
          latest_completed_loop=$(jq -r '[.workflow_runs[] | select(.name=="ChoreScore Autonomous App Loop" and .status=="completed")][0].id // empty' <<<"$all_runs")
          latest_ci=$(jq -r '[.workflow_runs[] | select(.name=="CI")][0].id // empty' <<<"$all_runs")

          refs=$(gh api --paginate "repos/$repo/git/matching-refs/heads/cycle/chorescore/")
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            cycle=$(sed -E 's#^refs/heads/cycle/chorescore/([0-9]+)/.*#\1#' <<<"$ref")
            if grep -Fxq "$cycle" <<<"$evidence_cycles" || [[ "$cycle" == "$active_loop" || "$cycle" == "$latest_completed_loop" ]]; then continue; fi
            short=${ref#refs/}
            echo "Deleting obsolete cycle ref $ref"
            gh api -X DELETE "repos/$repo/git/refs/$short" >/dev/null 2>&1 || echo "::warning::Could not delete $ref"
          done < <(jq -r '.[].ref' <<<"$refs")

          stale_cutoff=$((now - 3600))
          while IFS= read -r run; do
            [[ -z "$run" ]] && continue
            id=$(jq -r '.id' <<<"$run"); name=$(jq -r '.name' <<<"$run"); status=$(jq -r '.status' <<<"$run")
            created=$(jq -r '.created_at' <<<"$run"); created_epoch=$(date -u -d "$created" +%s)
            if [[ "$id" == "$GITHUB_RUN_ID" || "$id" == "$active_loop" || "$id" == "$latest_completed_loop" || "$id" == "$latest_ci" ]]; then continue; fi
            if grep -Fxq "$id" <<<"$evidence_cycles"; then continue; fi
            if [[ "$status" == completed ]]; then
              echo "Deleting obsolete completed run $id ($name)"
              gh api -X DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1 || echo "::warning::Could not delete run $id"
            elif (( created_epoch < stale_cutoff )); then
              echo "Attempting to remove stale nonterminal run $id ($name, $status)"
              gh api -X POST "repos/$repo/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
              sleep 1
              gh api -X DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1 || echo "::warning::GitHub retained stale run $id; it is ignored by the supervisor."
            fi
          done < <(jq -c '.workflow_runs[]' <<<"$all_runs")

      - name: Verify final release or keep one useful loop alive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"; workflow="chorescore-loop.yml"; now=$(date -u +%s); queued_ttl=900; run_ttl=21600
          release=$(gh api "repos/$repo/contents/docs/RELEASE_STATUS.json?ref=lab%2Fchorescore" --jq '.content' | tr -d '\n' | base64 --decode)
          final=false
          if jq -e '(.criteria|type=="array" and length>0) and all(.criteria[];.status=="complete") and (.activeCriteria|length==0) and .pendingArtifact==null and all(.openFindings[]?;(.mustFixBeforeRelease!=true) or .status=="resolved") and any(.criteria[];.id=="DRC-06" and any(.evidence[];.kind=="artifact") and any(.evidence[];.kind=="runtime-smoke"))' <<<"$release" >/dev/null; then
            reference=$(jq -r '.criteria[]|select(.id=="DRC-06")|.evidence[]|select(.kind=="artifact")|.reference' <<<"$release" | tail -1)
            report=${reference%% —*}
            if [[ "$report" == reports/artifacts/DEMO_APK_*.json ]]; then
              artifact=$(gh api "repos/$repo/contents/$report?ref=lab%2Fchorescore" --jq '.content' 2>/dev/null | tr -d '\n' | base64 --decode 2>/dev/null || true)
              if jq -e '.schemaVersion==1 and (.sourceSha|type=="string" and test("^[0-9a-f]{40}$")) and (.apkSha256|type=="string" and test("^[0-9a-f]{64}$")) and .installable==true and .standalone==true and .runtimeSmoke.apiLevel==35 and .runtimeSmoke.networkDisabled==true and .runtimeSmoke.metroRequired==false and .runtimeSmoke.onboardingCompleted==true and .runtimeSmoke.timerPersistedAcrossRestart==true and .runtimeSmoke.coreNavigationVisited==true' <<<"$artifact" >/dev/null 2>&1; then final=true; fi
            fi
          fi
          if [[ "$final" == true ]]; then echo "Final release fully attested; no successor required."; exit 0; fi

          runs=$(gh api "repos/$repo/actions/runs?per_page=50"); live=""
          while IFS= read -r run; do
            [[ -z "$run" ]] && continue
            id=$(jq -r '.id' <<<"$run"); status=$(jq -r '.status' <<<"$run"); created=$(jq -r '.created_at' <<<"$run")
            created_epoch=$(date -u -d "$created" +%s); age=$((now-created_epoch))
            case "$status" in
              queued) (( age < queued_ttl )) && live="$id" ;;
              in_progress|waiting|pending)
                jobs=$(gh api "repos/$repo/actions/runs/$id/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}')
                live_jobs=$(jq '[.jobs[]?|select(.status!="completed")]|length' <<<"$jobs")
                (( live_jobs > 0 && age < run_ttl )) && live="$id"
                ;;
            esac
            [[ -z "$live" ]] || break
          done < <(jq -c '.workflow_runs[]|select(.name=="ChoreScore Autonomous App Loop" and .status!="completed")' <<<"$runs")
          if [[ -n "$live" ]]; then echo "Useful autonomous loop already alive: $live"; exit 0; fi

          recovery=$(jq -r '[.workflow_runs[]|select(.name=="ChoreScore Autonomous App Loop" and .status=="completed")][0].id // "none"' <<<"$runs")
          before=$(date -u +%s)
          echo "No useful loop alive; dispatching successor with recovery=$recovery"
          gh workflow run "$workflow" --repo "$repo" --ref main -f human_note="Continuer automatiquement jusqu'au produit final attesté. Ox uniquement; retenter après indisponibilité fournisseur." -f recovery_cycle_key="$recovery"
          for attempt in {1..20}; do
            sleep 2
            fresh=$(gh api "repos/$repo/actions/runs?per_page=20" | jq -r --argjson before "$before" '.workflow_runs[]|select(.name=="ChoreScore Autonomous App Loop")|select((.created_at|fromdateiso8601)>=$before)|select(.status!="completed")|.id' | head -1)
            if [[ -n "$fresh" ]]; then echo "Successor confirmed: $fresh"; exit 0; fi
          done
          echo "::error::Dispatch returned but no successor became observable."
          exit 1
