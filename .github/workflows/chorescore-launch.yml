name: ChoreScore Launch Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".chorescore/launch/*.json"
      - ".chorescore/cleanup/*.json"
  workflow_run:
    workflows:
      - "ChoreScore Autonomous App Loop"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: chorescore-launch-bridge
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch requested autonomous build
    if: ${{ github.event_name == 'push' && github.repository == 'Mickalive/Chorescore' && !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout launch request
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          file=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^\.chorescore/(launch|cleanup)/[^/]+\.json$' | tail -1)
          test -n "$file"
          test -f "$file"
          jq -e 'type == "object"' "$file" >/dev/null

          if [[ "$file" == .chorescore/cleanup/* ]]; then
            kind=cleanup
            cycles=0
            note=""
            recovery=none
          else
            kind=launch
            cycles=$(jq -er '.cycles // 0 | if type == "number" and floor == . and . >= 0 and . <= 10000 then . else error("invalid cycles") end' "$file")
            note=$(jq -er '.human_note // "" | if type == "string" and length <= 4000 then . else error("invalid human_note") end' "$file")
            recovery=$(jq -er '.recovery_cycle_key // "none" | if type == "string" and (. == "none" or test("^[1-9][0-9]*$")) then . else error("invalid recovery_cycle_key") end' "$file")
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "cycles=$cycles" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          {
            echo "note<<CHORESCORE_NOTE"
            echo "$note"
            echo "CHORESCORE_NOTE"
          } >> "$GITHUB_OUTPUT"

      - name: Launch or replace stalled ChoreScore loop
        id: loop
        if: steps.request.outputs.kind == 'launch'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ steps.request.outputs.note }}
          CYCLES: ${{ steps.request.outputs.cycles }}
          RECOVERY: ${{ steps.request.outputs.recovery }}
        shell: bash
        run: |
          set -euo pipefail
          stale_after=900

          list_runs() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow chorescore-loop.yml --limit 30 \
              --json databaseId,status,url,createdAt
          }

          cancel_stale_queued() {
            local now cutoff runs stale
            now=$(date -u +%s)
            cutoff=$((now - stale_after))
            runs=$(list_runs)
            stale=$(jq -c --argjson cutoff "$cutoff" \
              '[.[] | select(.status == "queued" and ((.createdAt | fromdateiso8601) < $cutoff))] | .[]?' <<<"$runs")
            [[ -z "$stale" ]] && return 0
            while IFS= read -r run; do
              [[ -z "$run" ]] && continue
              id=$(jq -r '.databaseId' <<<"$run")
              created=$(jq -r '.createdAt' <<<"$run")
              echo "Cancelling stale queued ChoreScore run $id (queued since $created)."
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            done <<<"$stale"
          }

          find_active() {
            local now cutoff
            now=$(date -u +%s)
            cutoff=$((now - stale_after))
            list_runs | jq -c --argjson cutoff "$cutoff" '
              [.[] | select(
                .status == "in_progress" or
                .status == "waiting" or
                .status == "pending" or
                (.status == "queued" and ((.createdAt | fromdateiso8601) >= $cutoff))
              )] | sort_by(.createdAt) | last // empty'
          }

          cancel_stale_queued
          active=$(find_active)
          if [[ -z "$active" ]]; then
            gh workflow run chorescore-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f human_note="$NOTE" -f cycle_index=1 -f max_cycles="$CYCLES" \
              -f recovery_cycle_key="$RECOVERY"
            for attempt in {1..20}; do
              active=$(find_active)
              [[ -n "$active" ]] && break
              sleep 2
            done
          fi

          test -n "$active"
          run_id=$(jq -r '.databaseId' <<<"$active")
          run_status=$(jq -r '.status' <<<"$active")
          run_url=$(jq -r '.url' <<<"$active")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_status=$run_status" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Report resolved loop run
        if: steps.request.outputs.kind == 'launch' && steps.loop.outputs.run_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.loop.outputs.run_id }}
          RUN_STATUS: ${{ steps.loop.outputs.run_status }}
          RUN_URL: ${{ steps.loop.outputs.run_url }}
          RECOVERY: ${{ steps.request.outputs.recovery }}
        shell: bash
        run: |
          body=$(printf '### Boucle ChoreScore résolue\n\n- Run : [%s](%s)\n- État : **%s**\n- Récupération demandée : `%s`\n\nAucun agent local ni clé API externe.' "$RUN_ID" "$RUN_URL" "$RUN_STATUS" "$RECOVERY")
          printf '%s\n' "$body"

      - name: Delete superseded completed workflow runs
        if: steps.request.outputs.kind == 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_status=$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/RELEASE_STATUS.json?ref=lab%2Fchorescore" \
            --jq '.content' 2>/dev/null | tr -d '\n' | base64 --decode 2>/dev/null || printf '{}')
          evidence_runs=$(jq -c '[.criteria[]?.evidence[]?.cycle | select(test("^[1-9][0-9]*$")) | tonumber] | unique' <<<"$release_status")
          recent_loops=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow chorescore-loop.yml --limit 1 \
            --json databaseId --jq '[.[].databaseId]')
          recent_ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --limit 1 \
            --json databaseId --jq '[.[].databaseId]')
          protected=$(jq -cn --argjson evidence "$evidence_runs" --argjson loops "$recent_loops" --argjson ci "$recent_ci" \
            '$evidence + $loops + $ci | unique')
          latest_loop=$(jq -r '.[0] // empty' <<<"$recent_loops")
          deleted_ids=()
          while IFS= read -r run; do
            id=$(jq -r '.databaseId' <<<"$run")
            status=$(jq -r '.status' <<<"$run")
            workflow=$(jq -r '.workflowName' <<<"$run")

            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            [[ "$status" != completed ]] && continue
            if jq -e --argjson id "$id" 'index($id) != null' <<<"$protected" >/dev/null; then
              echo "Preserving evidence/recent run $id ($workflow)"
              continue
            fi

            echo "Deleting superseded run $id ($workflow)"
            if gh run delete "$id" --repo "$GITHUB_REPOSITORY"; then
              deleted_ids+=("$id")
            else
              echo "::warning::Unable to delete run $id"
            fi
          done < <(
            gh run list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json databaseId,status,workflowName,createdAt |
            jq -c '.[]'
          )

          deleted_count=${#deleted_ids[@]}
          if (( deleted_count == 0 )); then
            deleted_list="aucun"
          else
            deleted_list=$(IFS=', '; echo "${deleted_ids[*]}")
          fi
          body=$(printf '### Nettoyage GitHub Actions terminé\n\n- Runs obsolètes supprimés : **%s**\n- Identifiants : `%s`\n- Cycles porteurs de preuves, run autonome le plus récent et CI la plus récente : préservés\n- Dernier cycle autonome : `%s`\n\nBranches, commits, snapshots et rapports inchangés.' "$deleted_count" "$deleted_list" "$latest_loop")
          printf '%s\n' "$body" ||
            echo "::warning::Nettoyage terminé, mais commentaire de suivi impossible."

  watchdog:
    name: Keep unfinished autonomous loop alive
    if: ${{ github.repository == 'Mickalive/Chorescore' && !github.event.repository.fork && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout watchdog
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Give the loop a short chance to self-dispatch
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 60

      - name: Cancel stale queued autonomous runs
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          cutoff=$((now - 900))
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow chorescore-loop.yml --limit 30 \
            --json databaseId,status,createdAt)
          stale=$(jq -c --argjson cutoff "$cutoff" \
            '[.[] | select(.status == "queued" and ((.createdAt | fromdateiso8601) < $cutoff))] | .[]?' <<<"$runs")
          [[ -z "$stale" ]] && exit 0
          while IFS= read -r run; do
            [[ -z "$run" ]] && continue
            id=$(jq -r '.databaseId' <<<"$run")
            created=$(jq -r '.createdAt' <<<"$run")
            echo "Cancelling stale queued ChoreScore run $id (queued since $created)."
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done <<<"$stale"

          for attempt in {1..15}; do
            remaining=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow chorescore-loop.yml --limit 30 \
              --json databaseId,status,createdAt |
              jq --argjson cutoff "$cutoff" '[.[] | select(.status == "queued" and ((.createdAt | fromdateiso8601) < $cutoff))] | length')
            (( remaining == 0 )) && exit 0
            sleep 2
          done
          echo "::warning::A stale queued run is still cancelling; successor logic will retry on the next bridge event."

      - name: Guarantee a successor until the release is complete
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHORESCORE_LOOP_WORKFLOW: chorescore-loop.yml
        shell: bash
        run: bash .github/scripts/ensure-continuous-loop.sh
