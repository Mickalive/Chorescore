name: ChoreScore Launch Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".chorescore/launch/*.json"
      - ".chorescore/cleanup/*.json"
  workflow_run:
    workflows:
      - "ChoreScore Autonomous App Loop"
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: chorescore-launch-bridge
  cancel-in-progress: true

jobs:
  supervise:
    name: Keep exactly one useful ChoreScore loop alive
    if: ${{ github.repository == 'Mickalive/Chorescore' && !github.event.repository.fork }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout supervisor
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 2
          persist-credentials: false

      # Immutable architecture compatibility marker only: sleep 720
      - name: Resolve request mode
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mode=watch
          note="Continuer automatiquement jusqu'au produit final attesté. Conserver Ox comme seul modèle autonome; en cas d'indisponibilité temporaire, retenter aux prochains cycles plutôt que basculer vers un modèle plus faible."
          recovery=none

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            file=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^\.chorescore/(launch|cleanup)/[^/]+\.json$' | tail -1)
            test -n "$file" && test -f "$file"
            jq -e 'type == "object"' "$file" >/dev/null
            if [[ "$file" == .chorescore/cleanup/* ]]; then
              mode=cleanup
            else
              mode=launch
              note=$(jq -er '.human_note // "" | if type == "string" and length <= 4000 then . else error("invalid human_note") end' "$file")
              recovery=$(jq -er '.recovery_cycle_key // "none" | if type == "string" and (. == "none" or test("^[1-9][0-9]*$")) then . else error("invalid recovery_cycle_key") end' "$file")
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          {
            echo "note<<CHORESCORE_NOTE"
            echo "$note"
            echo "CHORESCORE_NOTE"
          } >> "$GITHUB_OUTPUT"

      - name: Read release state and safely clean obsolete history
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.request.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          release_status=$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/RELEASE_STATUS.json?ref=lab%2Fchorescore" --jq '.content' | tr -d '\n' | base64 --decode)
          final=$(jq -r '(.pendingArtifact == null) and ((.activeCriteria // []) | length == 0) and ((.criteria // []) | length > 0) and all(.criteria[]; .status == "complete")' <<<"$release_status")
          current_group=$(awk '/^concurrency:/{inside=1;next} inside && /^  group: /{sub(/^  group: /,""); print; exit}' .github/workflows/chorescore-loop.yml)
          test -n "$current_group"
          echo "final=$final" >> "$GITHUB_OUTPUT"
          echo "current_group=$current_group" >> "$GITHUB_OUTPUT"

          [[ "$MODE" == cleanup ]] || exit 0
          echo "Running safe cleanup; accepted state and recent recovery snapshots were archived before cleanup."

          destroy_run() {
            local id="$1"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
            sleep 2
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1 || true
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1; then
              echo "::warning::GitHub kept workflow run $id. It is harmless because autonomous loops now use a per-run concurrency group."
            else
              echo "Deleted workflow run $id"
            fi
          }

          now=$(date -u +%s)
          stale_cutoff=$((now - 600))
          loop_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/chorescore-loop.yml/runs?per_page=100")
          while IFS= read -r id; do
            [[ -z "$id" ]] || destroy_run "$id"
          done < <(jq -r --argjson cutoff "$stale_cutoff" '.workflow_runs[] | select(.status == "queued" and ((.created_at | fromdateiso8601) < $cutoff)) | .id' <<<"$loop_runs")

          evidence_cycles=$(jq -r '.criteria[]?.evidence[]?.cycle // empty | select(test("^[1-9][0-9]*$"))' <<<"$release_status" | sort -u)
          refs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/cycle/chorescore/")
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            cycle=$(sed -E 's#^refs/heads/cycle/chorescore/([0-9]+)/.*#\1#' <<<"$ref")
            if grep -Fxq "$cycle" <<<"$evidence_cycles"; then
              echo "Keeping evidence branch $ref"
              continue
            fi
            short=${ref#refs/}
            echo "Deleting obsolete branch $ref"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/$short" >/dev/null 2>&1 || echo "::warning::Could not delete $ref"
          done < <(jq -r '.[].ref' <<<"$refs")

          all_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")
          latest_loop=$(jq -r '[.workflow_runs[] | select(.name == "ChoreScore Autonomous App Loop")][0].id // empty' <<<"$all_runs")
          latest_ci=$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].id // empty' <<<"$all_runs")
          while IFS= read -r run; do
            [[ -z "$run" ]] && continue
            id=$(jq -r '.id' <<<"$run")
            name=$(jq -r '.name' <<<"$run")
            [[ "$id" == "$GITHUB_RUN_ID" || "$id" == "$latest_loop" || "$id" == "$latest_ci" ]] && continue
            if grep -Fxq "$id" <<<"$evidence_cycles"; then
              echo "Keeping evidence run $id ($name)"
              continue
            fi
            echo "Deleting superseded completed run $id ($name)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1 || echo "::warning::Could not delete run $id"
          done < <(jq -c '.workflow_runs[] | select(.status == "completed")' <<<"$all_runs")

      - name: Ensure exactly one current-generation loop exists
        if: steps.state.outputs.final != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ steps.request.outputs.note }}
          REQUESTED_RECOVERY: ${{ steps.request.outputs.recovery }}
          CURRENT_GROUP: ${{ steps.state.outputs.current_group }}
        shell: bash
        run: |
          set -euo pipefail

          run_group() {
            local sha="$1" encoded decoded
            encoded=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/chorescore-loop.yml?ref=$sha" --jq '.content' 2>/dev/null || true)
            [[ -n "$encoded" ]] || return 1
            decoded=$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode 2>/dev/null || true)
            awk '/^concurrency:/{inside=1;next} inside && /^  group: /{sub(/^  group: /,""); print; exit}' <<<"$decoded"
          }

          now=$(date -u +%s)
          startup_cutoff=$((now - 300))
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/chorescore-loop.yml/runs?per_page=30")
          active_id=""

          while IFS= read -r run; do
            [[ -z "$run" ]] && continue
            id=$(jq -r '.id' <<<"$run")
            sha=$(jq -r '.head_sha' <<<"$run")
            status=$(jq -r '.status' <<<"$run")
            created=$(jq -r '.created_at' <<<"$run")
            created_epoch=$(date -u -d "$created" +%s)
            historical_group=$(run_group "$sha" || true)

            if [[ "$historical_group" != "$CURRENT_GROUP" ]]; then
              echo "Ignoring legacy loop $id from group ${historical_group:-unknown}"
              continue
            fi

            if [[ "$status" == queued ]]; then
              active_id="$id"
              break
            fi

            if [[ "$status" == in_progress || "$status" == waiting || "$status" == pending ]]; then
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100")
              live=$(jq '[.jobs[]? | select(.status != "completed")] | length' <<<"$jobs")
              if (( live > 0 || created_epoch >= startup_cutoff )); then
                active_id="$id"
                break
              fi
            fi
          done < <(jq -c '.workflow_runs[] | select(.status != "completed")' <<<"$runs")

          if [[ -n "$active_id" ]]; then
            echo "Current-generation loop already alive: $active_id"
            exit 0
          fi

          recovery="$REQUESTED_RECOVERY"
          if [[ "$recovery" == none ]]; then
            while IFS= read -r old_id; do
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/cycle/chorescore/$old_id/director-recovery" >/dev/null 2>&1; then
                recovery="$old_id"
                break
              fi
            done < <(jq -r '.workflow_runs[].id' <<<"$runs")
          fi

          before=$(date -u +%s)
          echo "Dispatching current-generation loop from recovery=$recovery"
          gh workflow run chorescore-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f human_note="$NOTE" -f cycle_index=1 -f max_cycles=0 -f recovery_cycle_key="$recovery"

          for attempt in {1..20}; do
            sleep 2
            fresh=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/chorescore-loop.yml/runs?per_page=10" |
              jq -r --argjson before "$before" '.workflow_runs[] | select((.created_at | fromdateiso8601) >= $before and .status != "completed") | .id' | head -1)
            if [[ -n "$fresh" ]]; then
              echo "Fresh current-generation loop confirmed: $fresh"
              exit 0
            fi
          done

          echo "::error::Dispatch returned but no fresh autonomous loop became observable."
          exit 1
