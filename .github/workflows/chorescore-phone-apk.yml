name: ChoreScore Phone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chorescore-phone-apk.yml"

permissions:
  contents: write

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_DATA_MODE: demo

jobs:
  phone-apk:
    name: Build installable APK for real-device testing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout accepted product
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: lab/chorescore
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build release APK
        id: build
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          npx --no-install expo prebuild --platform android --no-install
          (cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace)
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          apk_size=$(stat -c%s "$apk")
          printf '%s  %s\n' "$apk_sha" "app-release.apk" > "$GITHUB_WORKSPACE/APK_SHA256.txt"
          printf '%s\n' "$source_sha" > "$GITHUB_WORKSPACE/SOURCE_SHA.txt"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "apk_size=$apk_size" >> "$GITHUB_OUTPUT"
          echo "artifact_name=chorescore-phone-$source_sha" >> "$GITHUB_OUTPUT"

      - name: Upload phone APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.apk_path }}
            APK_SHA256.txt
            SOURCE_SHA.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish latest APK on phone-apk branch
        if: ${{ steps.build.outputs.apk_size < 100000000 }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.build.outputs.apk_path }}
          SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          publish_dir=$(mktemp -d)
          git -C "$publish_dir" init
          git -C "$publish_dir" config user.name "chorescore-phone-builder"
          git -C "$publish_dir" config user.email "chorescore-phone-builder@users.noreply.github.com"
          cp "$APK_PATH" "$publish_dir/app-release.apk"
          cp "$GITHUB_WORKSPACE/APK_SHA256.txt" "$publish_dir/APK_SHA256.txt"
          cp "$GITHUB_WORKSPACE/SOURCE_SHA.txt" "$publish_dir/SOURCE_SHA.txt"
          cat > "$publish_dir/README.md" <<EOF
          # ChoreScore phone APK

          Latest real-device test build from accepted product source:

          \`$SOURCE_SHA\`

          Download \`app-release.apk\` and install it on Android.
          EOF
          git -C "$publish_dir" add app-release.apk APK_SHA256.txt SOURCE_SHA.txt README.md
          git -C "$publish_dir" commit -m "phone apk: $SOURCE_SHA"
          git -C "$publish_dir" branch -M phone-apk
          git -C "$publish_dir" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C "$publish_dir" -c "http.extraheader=AUTHORIZATION: basic $auth" push --force origin phone-apk

      - name: Publish latest APK as GitHub Release fallback
        if: ${{ steps.build.outputs.apk_size >= 100000000 }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.build.outputs.apk_path }}
          SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view phone-apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload phone-apk-latest "$APK_PATH#app-release.apk" "$GITHUB_WORKSPACE/APK_SHA256.txt" "$GITHUB_WORKSPACE/SOURCE_SHA.txt" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit phone-apk-latest --title "ChoreScore Phone APK" --notes "Latest accepted real-device build: $SOURCE_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create phone-apk-latest "$APK_PATH#app-release.apk" "$GITHUB_WORKSPACE/APK_SHA256.txt" "$GITHUB_WORKSPACE/SOURCE_SHA.txt" --title "ChoreScore Phone APK" --notes "Latest accepted real-device build: $SOURCE_SHA" --repo "$GITHUB_REPOSITORY"
          fi
