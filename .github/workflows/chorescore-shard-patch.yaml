name: ChoreScore shard patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chorescore-shard-patch.yaml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Apply and validate sharding patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/chorescore-shard.patch"
          git apply --check "$RUNNER_TEMP/chorescore-shard.patch"
          git apply "$RUNNER_TEMP/chorescore-shard.patch"
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/chorescore-loop.yml")'
          bash .github/scripts/verify-workflow-architecture.sh
          grep -Fq 'merge_candidate:' .github/workflows/chorescore-loop.yml
          grep -Fq 'candidateKey:' .github/workflows/chorescore-loop.yml
          grep -Fq 'assignments.<role>.slices' .github/workflows/chorescore-loop.yml
          mkdir -p speed-generated
          cp .github/workflows/chorescore-loop.yml speed-generated/chorescore-loop-sharded.yml.txt

      - name: Stage validated workflow blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name chorescore-governance
          git config user.email chorescore-governance@users.noreply.github.com
          git add speed-generated/chorescore-loop-sharded.yml.txt
          git commit -m "ci: stage validated sharded ChoreScore workflow"
          git push origin HEAD:main
