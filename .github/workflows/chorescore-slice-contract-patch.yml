name: ChoreScore slice contract patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chorescore-slice-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Patch loop contract deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/chorescore-loop.yml')
          text = path.read_text(encoding='utf-8')

          old = '          git add -A -- "${human_owned_paths[@]}" "$marker" "${bootstrap_paths[@]}"\n'
          new = (
              '          python3 .github/scripts/normalize-task-slices.py directives/TASKS.json\n'
              '          git add -A -- "${human_owned_paths[@]}" "$marker" "${bootstrap_paths[@]}" directives/TASKS.json\n'
          )
          if text.count(old) != 1:
              raise SystemExit('accepted-lane normalization insertion point changed')
          text = text.replace(old, new, 1)

          old = (
              'For each enabled role, decide the next work shape in directives/TASKS.json: if the next coherent mission is realistically expected to require more than about 12 changed files and can be separated safely, add assignments.<role>.slices with exactly two entries in order, ids "a" and "b"; each entry must have a precise objective and a non-empty allowedPaths array of clean relative path prefixes, the two path-prefix perimeters must not overlap, and each slice must be independently implementable from the same accepted base within at most 12 changed files. If those conditions are not all true, omit/remove slices and assign one bounded coherent mission instead. Never create more than two slices and never split work that needs both slices editing the same file.'
          )
          new = (
              'For each enabled role, decide the next work shape in directives/TASKS.json: if the next coherent mission is realistically expected to require more than about 12 changed files and can be separated safely, add assignments.<role>.slices with exactly two entries in this canonical JSON form: "slices": [{"id":"a","objective":"first independent objective","allowedPaths":["first/role-valid/prefix"]},{"id":"b","objective":"second independent objective","allowedPaths":["second/role-valid/prefix"]}]. The slices value MUST be a JSON array in a-then-b order; NEVER write it as an object/map keyed by "a" and "b". Each entry must have a precise objective and a non-empty allowedPaths array of clean relative path prefixes, the two path-prefix perimeters must not overlap, and each slice must be independently implementable from the same accepted base within at most 12 changed files. If those conditions are not all true, omit/remove slices and assign one bounded coherent mission instead. Never create more than two slices and never split work that needs both slices editing the same file.'
          )
          if text.count(old) != 1:
              raise SystemExit('director slice instruction insertion point changed')
          text = text.replace(old, new, 1)

          old = '          exit "$director_status"\n\n      - name: Verify Director preserved the audited product tree\n'
          new = (
              '          exit "$director_status"\n\n'
              '      - name: Canonicalize Director task slicing contract\n'
              '        id: task_contract\n'
              '        if: always()\n'
              '        continue-on-error: true\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          python3 .github/scripts/normalize-task-slices.py directives/TASKS.json\n\n'
              '      - name: Verify Director preserved the audited product tree\n'
          )
          if text.count(old) != 1:
              raise SystemExit('director contract normalization insertion point changed')
          text = text.replace(old, new, 1)

          old = "steps.trusted_product.outcome == 'success' && steps.verification.outcome == 'success'"
          new = "steps.task_contract.outcome == 'success' && steps.trusted_product.outcome == 'success' && steps.verification.outcome == 'success'"
          if text.count(old) != 1:
              raise SystemExit('director decision condition changed')
          text = text.replace(old, new, 1)

          old = "steps.director_run.outcome == 'failure' ||"
          new = "steps.director_run.outcome == 'failure' || steps.task_contract.outcome == 'failure' ||"
          if text.count(old) != 2:
              raise SystemExit(f'expected two director failure gates, found {text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate migration, YAML and workflow guards
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          cat > "$tmp" <<'JSON'
          {
            "assignments": {
              "mobile": {
                "enabled": true,
                "slices": {
                  "b": {"objective": "ui", "allowedPaths": ["app"]},
                  "a": {"objective": "domain", "allowedPaths": ["src", "tests"]}
                }
              },
              "backend": {"enabled": false}
            }
          }
          JSON
          python3 .github/scripts/normalize-task-slices.py "$tmp"
          jq -e '.assignments.mobile.slices | type == "array" and length == 2 and .[0].id == "a" and .[1].id == "b"' "$tmp" >/dev/null
          jq -e '.assignments.mobile.slices[0].allowedPaths == ["src","tests"] and .assignments.mobile.slices[1].allowedPaths == ["app"]' "$tmp" >/dev/null
          rm -f "$tmp"

          grep -Fq 'python3 .github/scripts/normalize-task-slices.py directives/TASKS.json' .github/workflows/chorescore-loop.yml
          test "$(grep -Fc 'python3 .github/scripts/normalize-task-slices.py directives/TASKS.json' .github/workflows/chorescore-loop.yml)" -eq 2
          grep -Fq 'The slices value MUST be a JSON array in a-then-b order; NEVER write it as an object/map keyed by "a" and "b".' .github/workflows/chorescore-loop.yml
          grep -Fq "steps.task_contract.outcome == 'failure'" .github/workflows/chorescore-loop.yml
          grep -Fq "steps.task_contract.outcome == 'success'" .github/workflows/chorescore-loop.yml

          # Validate the final three-workflow architecture, not this temporary helper.
          rm .github/workflows/chorescore-slice-contract-patch.yml
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/chorescore-loop.yml", aliases: true)'
          bash .github/scripts/verify-workflow-architecture.sh

      - name: Stage validated ordinary workflow blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p speed-generated
          cp .github/workflows/chorescore-loop.yml speed-generated/chorescore-loop-slice-contract.yml.txt
          git config user.name chorescore-control-patch
          git config user.email chorescore-control-patch@users.noreply.github.com
          git add speed-generated/chorescore-loop-slice-contract.yml.txt
          git commit -m 'ci: stage validated slice contract workflow'
          git push origin HEAD:main
