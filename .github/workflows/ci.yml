name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_DATA_MODE: demo

jobs:
  app:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Verified in the official actions/checkout repository on 2026-08-24.
      - name: Checkout without persisted credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Require a committed lockfile
        run: test -f package-lock.json

      # Verified in the official actions/setup-node repository on 2026-08-24.
      - name: Use the repository Node.js baseline
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exactly the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and test
        run: npm run check

      - name: Build the offline Android demo bundle
        run: npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/chorescore-android"

      - name: Reject known high-impact production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  functions:
    name: Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      # Verified in the official actions/checkout repository on 2026-08-24.
      - name: Checkout without persisted credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Require a committed Functions lockfile
        run: test -f package-lock.json

      # Verified in the official actions/setup-node repository on 2026-08-24.
      - name: Use the repository Node.js baseline
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install exactly the locked Functions dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and unit-test Functions
        run: npm run check

      - name: Reject known high-impact production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  governance:
    name: Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMMUTABLE_MANIFEST_SHA256: a1ca772acf99f51a2ebc8f0ac336724601c3609f8a401c8b7ada8b465ef4e991
    steps:
      - name: Checkout immutable governance
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Verify every human-owned role and contract
        run: bash .github/scripts/verify-immutable-governance.sh

      - name: Validate orchestration scripts and JSON
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/verify-immutable-governance.sh
          bash -n .github/scripts/validate-release-state.sh
          bash -n .github/scripts/run-opencode-with-retry.sh
          bash -n .github/scripts/recover-transient-opencode.sh
          bash -n .github/scripts/ensure-continuous-loop.sh
          bash -n .github/scripts/smoke-android-apk.sh
          bash -n .github/scripts/verify-product-coherence.sh
          bash .github/scripts/verify-product-coherence.sh
          jq empty governance/RELEASE_DEFINITION.json
          jq empty docs/RELEASE_STATUS.json
          jq empty directives/TASKS.json
          test "$(find .opencode/agents -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 4
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 3
