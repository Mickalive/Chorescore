name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_DATA_MODE: demo

jobs:
  app:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Node baseline
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and tests
        run: npm run check

      - name: Offline Android bundle
        run: npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/chorescore-android"

      - name: Production vulnerability gate
        run: npm audit --omit=dev --audit-level=high

  functions:
    name: Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Node baseline
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and tests
        run: npm run check

      - name: Production vulnerability gate
        run: npm audit --omit=dev --audit-level=high

  governance:
    name: Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMMUTABLE_MANIFEST_SHA256: eba7b17dff1f9f004c469260236c83cb43305d1649c5d2e780e090ad4db90b39
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Immutable constitution
        run: bash .github/scripts/verify-immutable-governance.sh

      - name: Control-plane architecture
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/verify-immutable-governance.sh
          bash -n .github/scripts/validate-release-state.sh
          bash -n .github/scripts/run-opencode-with-retry.sh
          bash -n .github/scripts/normalize-audit-json.sh
          bash -n .github/scripts/validate-audit-json.sh
          bash -n .github/scripts/integrate-audited-candidates.sh
          bash -n .github/scripts/trusted-product-tree.sh
          bash -n .github/scripts/verify-final-release.sh
          bash -n .github/scripts/smoke-android-apk.sh
          bash -n .github/scripts/verify-product-coherence.sh
          bash -n .github/scripts/verify-workflow-architecture.sh
          bash .github/scripts/verify-product-coherence.sh
          bash .github/scripts/verify-workflow-architecture.sh
          jq empty governance/RELEASE_DEFINITION.json
          jq empty docs/RELEASE_STATUS.json
          jq empty directives/TASKS.json
