name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_DATA_MODE: demo

jobs:
  app:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Verified in the official actions/checkout repository on 2026-08-24.
      - name: Checkout without persisted credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Require a committed lockfile
        run: test -f package-lock.json

      # Verified in the official actions/setup-node repository on 2026-08-24.
      - name: Use the repository Node.js baseline
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exactly the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and test
        run: npm run check

      - name: Build the offline Android demo bundle
        run: npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/chorescore-android"

      - name: Reject known high-impact production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  functions:
    name: Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      # Verified in the official actions/checkout repository on 2026-08-24.
      - name: Checkout without persisted credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Require a committed Functions lockfile
        run: test -f package-lock.json

      # Verified in the official actions/setup-node repository on 2026-08-24.
      - name: Use the repository Node.js baseline
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install exactly the locked Functions dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and unit-test Functions
        run: npm run check

      - name: Reject known high-impact production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
