name: ChoreScore One-Time Control Plane Repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/control-plane-repair.yml"

permissions:
  contents: write

concurrency:
  group: chorescore-control-plane-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and verify repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/control-plane-repair.py | tee "$RUNNER_TEMP/control-plane-repair.out"
          manifest_hash=$(sed -n 's/^IMMUTABLE_MANIFEST_SHA256=//p' "$RUNNER_TEMP/control-plane-repair.out" | tail -1)
          [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]
          git rm .github/workflows/control-plane-repair.yml .github/scripts/control-plane-repair.py
          export IMMUTABLE_MANIFEST_SHA256="$manifest_hash"
          bash .github/scripts/verify-immutable-governance.sh
          bash -n .github/scripts/run-opencode-with-retry.sh
          bash -n .github/scripts/ensure-continuous-loop.sh
          bash .github/scripts/verify-workflow-architecture.sh
          git config user.name chorescore-control-plane-repair
          git config user.email chorescore-control-plane-repair@users.noreply.github.com
          git add -A -- .github
          git commit -m "ci: make recovery reuse accepted evidence"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
