name: ChoreScore cycle observer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cycle-observer.yml
  workflow_run:
    workflows:
      - ChoreScore continuous OpenCode Ox loop
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: chorescore-cycle-observer
  cancel-in-progress: false

jobs:
  report-kickoff:
    name: Report the existing kickoff run
    if: >-
      ${{ github.event_name == 'push' &&
          github.event.repository.visibility == 'private' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Locate and report the cycle run
        shell: bash
        run: |
          set -euo pipefail

          run_json=""
          for attempt in 1 2 3 4 5; do
            run_json=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow chorescore-loop.yml \
              --commit "$TARGET_SHA" \
              --limit 1 \
              --json databaseId,status,conclusion,url,headSha,event,createdAt \
              --jq '.[0] // empty')
            [[ -n "$run_json" ]] && break
            sleep 10
          done

          if [[ -z "$run_json" ]]; then
            body=$(printf '### Observateur du cycle ChoreScore\n\nAucun run lié au commit `%s` n’a été trouvé. Le déclenchement doit être vérifié dans GitHub Actions.' "$TARGET_SHA")
          else
            run_id=$(jq -r '.databaseId' <<<"$run_json")
            status=$(jq -r '.status' <<<"$run_json")
            conclusion=$(jq -r 'if .conclusion == null or .conclusion == "" then "en attente" else .conclusion end' <<<"$run_json")
            run_url=$(jq -r '.url' <<<"$run_json")
            body=$(printf '### Observateur du cycle ChoreScore\n\n- Run : [%s](%s)\n- Commit : `%s`\n- État : **%s**\n- Conclusion : **%s**\n\nAucune clé API externe n’est utilisée.' "$run_id" "$run_url" "$TARGET_SHA" "$status" "$conclusion")
          fi

          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$body"

  report-completion:
    name: Report the completed cycle
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.repository.visibility == 'private' &&
          github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Report the terminal result
        shell: bash
        run: |
          set -euo pipefail
          body=$(printf '### Cycle ChoreScore terminé\n\n- Run : [%s](%s)\n- Commit : `%s`\n- Conclusion : **%s**\n\nLa fusion et le déploiement restent manuels.' "$RUN_ID" "$RUN_URL" "$HEAD_SHA" "$CONCLUSION")
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$body"
