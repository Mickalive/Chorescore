name: OpenCode Ox Alpha manual audit

on:
  workflow_dispatch:
    inputs:
      task:
        description: Audit borné à exécuter en lecture seule
        required: true
        type: choice
        default: review
        options:
          - review
          - security-audit

# No repository write permission is ever granted to this workflow.
permissions:
  contents: read

concurrency:
  group: opencode-ox-alpha-manual
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only Ox Alpha audit
    if: ${{ github.event.repository.visibility == 'private' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Verified in the official actions/checkout repository on 2026-08-24.
      - name: Checkout the default-branch commit without credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up reviewed OpenCode CLI
        uses: ./.github/actions/setup-opencode

      - name: Run the bounded read-only audit with public Ox
        shell: bash
        env:
          AUDIT_TASK: ${{ inputs.task }}
        run: |
          opencode run \
            --model opencode/x-preview-f-free \
            --agent github-auditor \
            "Analyse en lecture seule le commit extrait. Mode demandé : ${AUDIT_TASK}. Respecte AGENTS.md et la commande correspondante dans .opencode/commands. Ne lance aucune commande, ne modifie aucun fichier, ne divulgue aucune donnée et fournis uniquement des constats traçables destinés à une revue humaine."
